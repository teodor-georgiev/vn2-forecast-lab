name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vn2-from-scratch/requirements.txt

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r vn2-from-scratch/requirements.txt

      - name: pytest
        working-directory: vn2-from-scratch
        run: python -m pytest tests -q
